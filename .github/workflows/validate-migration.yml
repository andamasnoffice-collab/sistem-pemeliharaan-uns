name: Validate migration
on:
  push:
    branches: [migration/vue3-typescript-vite]
  pull_request:
    branches: [main]

concurrency:
  group: migration-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
